[project]
name = "voiceprint"
version = "0.1.0"
description = "Train a model on your writing, then draft in your voice from the CLI or any MCP client."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "modal>=1.5",
    "numpy>=1.26",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
voiceprint = "voiceprint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voiceprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
